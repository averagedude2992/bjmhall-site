name: Sync busy dates

on:
  schedule:
    # Every 3 hours, plus a manual run button in the Actions tab.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-busy-dates
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install -r scripts/requirements.txt

      - name: Run parser self-test
        run: python scripts/sync-busy-dates.py --self-test

      - name: Require calendar URL secret
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: |
          if [ -z "$OUTLOOK_ICS_URL" ]; then
            echo "Add the OUTLOOK_ICS_URL repository secret, then re-run this workflow."
            exit 1
          fi

      - name: Update busy dates
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: python scripts/sync-busy-dates.py

      - name: Commit if the dates changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/busy-dates.json
          if git diff --staged --quiet; then
            echo "No date changes to commit."
          else
            git commit -m "Update hall availability dates"
            git push
          fi
