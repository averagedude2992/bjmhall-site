<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BJM Hall Events – Hayward, CA | Portuguese Community</title>
<meta name="description" content="Portuguese community events at the BJM Hall in Hayward. This page now opens the home page.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://bjmhall.org/">
<script>
  // Keep old events.html links, including #events, #signup, #roots, and #nye-title.
  // Rental anchors that were only ever on the home page go straight to the rental page.
  (function () {
    var hash = window.location.hash;
    var rental = hash === "#rent" || hash === "#grounds" || hash === "#grounds-title" || hash === "#types" || hash === "#photos" || hash === "#details" || hash === "#availability" || hash === "#request" || hash === "#location";
    if (rental) {
      window.location.replace("rent.html" + window.location.search + hash);
      return;
    }
    var home = window.location.pathname.replace(/[^/]*$/, "") + window.location.search + hash;
    window.location.replace(home);
  })();
</script>
<meta http-equiv="refresh" content="0; url=./">
<link rel="icon" href="images/flag-pt.svg" type="image/svg+xml">
</head>

</body>
</html>
